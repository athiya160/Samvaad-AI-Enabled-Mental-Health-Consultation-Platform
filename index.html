<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23466d49' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samvaad | Affordable, Stigma-Free Mental Health Care for Bharat</title>
    <meta name="description" content="Pan-India mental health platform connecting you with licensed psychiatrists and clinical psychologists for under ₹500. Free conversational AI reflection companion with zero barrier." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Netlify Badge Suppression -->
    <style>
      #nl-badge-frame,
      iframe#nl-badge-frame,
      iframe[id*="nl-badge"],
      iframe[title*="Netlify"],
      iframe[title*="Powered by Netlify"],
      #netlify-hud,
      .netlify-hud,
      [data-netlify-hud],
      div[class*="netlify-hud"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -99999px !important;
        top: -99999px !important;
      }
    </style>
    <script>
      (function() {
        const removeBadge = () => {
          const badge = document.getElementById('nl-badge-frame') || document.querySelector('iframe[title*="Netlify"]');
          if (badge) badge.remove();
        };
        const obs = new MutationObserver(removeBadge);
        obs.observe(document.documentElement, { childList: true, subtree: true });
        window.addEventListener('load', removeBadge);
        setInterval(removeBadge, 300);
      })();
    </script>
  </head>
  <body class="bg-[#fafaf8] text-slate-800 antialiased selection:bg-sage-200 selection:text-sage-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
